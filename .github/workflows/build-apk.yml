name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.86.5" "flet-audio>=0.86.0" "flet-android-notifications>=0.11.0" "cryptography>=42.0.0" "pyjnius>=1.6.1"

      - name: Generate Flutter project (first build)
        run: |
          flet build apk --module-name mobile_main --project "LanTalk" --org "com.lantalk" --product "lantalk" --build-number "1" --build-version "3.0.0" --clear-cache
        continue-on-error: true

      - name: Patch Flutter project for native notifications
        run: |
          flet-android-notifications-patch --project-root build/flutter

      - name: Build patched APK
        run: |
          cd build/flutter
          # flet build apk 在内部 flutter build 时会注入这两个环境变量，
          # 但我们在 flet build 之后手动运行 flutter build，需要手动设置，
          # 否则 serious_python_android 的 build.gradle.kts 会报错：
          # SERIOUS_PYTHON_SITE_PACKAGES environment variable is not set
          export SERIOUS_PYTHON_SITE_PACKAGES="$GITHUB_WORKSPACE/build/site-packages"
          export SERIOUS_PYTHON_APP="$GITHUB_WORKSPACE/build/python-app"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
