name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet CLI (retry on network flake)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            python -m pip install --upgrade pip
            pip install flet==0.86.5
            flet --version

      - name: Pre-build self-check
        run: |
          python -m py_compile mobile_main.py
          test -f assets/icon.png
          test -f assets/fonts/Twemoji.ttf
          test -d assets/flags

      - name: Setup Gradle init script for desugaring
        run: |
          GRADLE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_HOME/init.d"
          cp scripts/desugaring-init.gradle "$GRADLE_HOME/init.d/"
          echo "Installed init scripts:"
          ls -la "$GRADLE_HOME/init.d/"

      - name: Build APK with icon (retry + clean cache on failure)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            rm -rf build/ .flet/
            # Step 1: Let flet generate the Flutter project (may fail at Gradle step)
            flet build apk --module-name mobile_main --project "LanTalk" --org "com.lantalk" --product "lantalk" --build-number "20261003" --build-version "4.0.0" || true
            # Step 2: Find the generated Flutter project (where pubspec.yaml lives)
            echo "=== Searching for Flutter project ==="
            FLUTTER_DIR=$(find build -name "pubspec.yaml" -not -path "*/.dart_tool/*" | head -1 | xargs dirname 2>/dev/null || echo "")
            echo "Flutter project dir: $FLUTTER_DIR"
            if [ -z "$FLUTTER_DIR" ]; then
              echo "ERROR: No Flutter project found!"
              find build -type d -maxdepth 3 2>/dev/null || echo "build/ is empty"
              exit 1
            fi
            # Step 3: Override jni version
            cd "$FLUTTER_DIR"
            printf '\ndependency_overrides:\n  jni: ^1.1.0\n' >> pubspec.yaml
            echo "=== pubspec.yaml tail ==="
            tail -5 pubspec.yaml
            # Step 4: Build APK manually
            flutter pub get
            flutter build apk --release
            # Step 5: Find and copy APK to workspace root
            echo "=== Searching for APK ==="
            APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
            echo "APK found at: $APK_PATH"
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" "$GITHUB_WORKSPACE/app-release.apk"
              echo "APK copied to workspace root"
              ls -la "$GITHUB_WORKSPACE/app-release.apk"
            else
              echo "ERROR: APK not found!"
              find . -name "*.apk" -type f 2>/dev/null
              exit 1
            fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-apk
          path: app-release.apk
