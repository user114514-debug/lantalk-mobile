name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.86.5" "flet-audio>=0.86.0" "pyjnius>=1.6.1"

      - name: Build APK
        run: |
          flet build apk --module-name mobile_main --project "LanTalk" --org "com.lantalk" --product "lantalk" --build-number "1" --build-version "2.8.5" --clear-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-apk
          path: build/apk/*.apk
