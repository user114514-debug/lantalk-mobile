name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.86.5" "flet-audio>=0.86.0" "cryptography>=42.0.0" "pyjnius>=1.6.1" "psutil>=5.9.0"

      - name: Patch MainActivity to FlutterFragmentActivity
        run: |
          # flet 默认 MainActivity 继承 FlutterActivity（无 AndroidX ActivityResultRegistry），
          # 改成 FlutterFragmentActivity 以获得完整 AndroidX 支持（文件选择/拍照/生物识别）。
          # 递归定位 site-packages 内的模板，不依赖 flet 内部目录结构。
          PATCH_DONE=0
          ROOTS=$(python -c "import site; ps=site.getsitepackages()+[site.getusersitepackages()]; print(' '.join(ps))")
          for root in $ROOTS; do
            [ -d "$root" ] || continue
            while IFS= read -r f; do
              echo "=== Found Flutter template: $f ==="
              sed -i \
                -e 's#io\.flutter\.embedding\.android\.FlutterActivity#io.flutter.embedding.android.FlutterFragmentActivity#g' \
                -e 's#FlutterActivity()#FlutterFragmentActivity()#g' \
                "$f"
              echo "--- after patch ---"
              grep -n "Flutter" "$f" || true
              PATCH_DONE=1
            done < <(grep -rl "embedding.android.FlutterActivity" "$root" 2>/dev/null)
          done
          if [ "$PATCH_DONE" -eq 0 ]; then
            echo "::warning::No FlutterActivity template found - check flet packaging"
          fi

      - name: Build APK (auto-retry on network failure)
        run: |
          for i in 1 2 3; do
            echo "===== Build attempt $i/3 ====="
            if flet build apk --module-name mobile_main --project "LanTalk" --org "com.lantalk" --product "lantalk" --build-number "7" --build-version "3.7.4" --arch arm64-v8a; then
              echo "===== Build succeeded on attempt $i ====="
              break
            fi
            echo "===== Attempt $i failed ====="
            if [ "$i" -eq 3 ]; then
              echo "===== All 3 attempts failed ====="
              exit 1
            fi
            # 清理损坏的下载缓存后重试
            flet clean || true
            find ~/.gradle -iname "*python-build*" -delete 2>/dev/null || true
            find build -iname "*distArchive*" -delete 2>/dev/null || true
            echo "===== Cache cleaned, waiting 15s before retry ====="
            sleep 15
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-apk
          path: build/apk/*.apk
