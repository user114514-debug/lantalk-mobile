name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet CLI (retry on network flake)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            python -m pip install --upgrade pip
            pip install flet==0.86.5
            flet --version

      - name: Pre-build self-check
        run: |
          python -m py_compile mobile_main.py
          test -f assets/icon.png
          test -f assets/fonts/Twemoji.ttf
          test -d assets/flags

      - name: Setup Gradle init script for desugaring
        run: |
          GRADLE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_HOME/init.d"
          cp scripts/desugaring-init.gradle "$GRADLE_HOME/init.d/"
          echo "Installed init scripts:"
          ls -la "$GRADLE_HOME/init.d/"

      - name: Build APK with icon (retry + jni fix)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            rm -rf build/ .flet/
            # Step 1: Let flet generate Flutter project (may fail at Gradle step)
            flet build apk --module-name mobile_main --project "LanTalk" --org "com.lantalk" --product "lantalk" --build-number "20261003" --build-version "4.0.0" || true
            # Step 2: Find the generated Flutter project
            echo "=== Searching for Flutter project ==="
            FLUTTER_DIR=$(find build -name "pubspec.yaml" -not -path "*/.dart_tool/*" | head -1 | xargs dirname 2>/dev/null || echo "")
            echo "Flutter project dir: $FLUTTER_DIR"
            if [ -z "$FLUTTER_DIR" ]; then
              echo "ERROR: No Flutter project found!"
              find build -type d -maxdepth 3 2>/dev/null || echo "build/ is empty"
              exit 1
            fi
            cd "$FLUTTER_DIR"
            # Step 3: Fix jni version - replace in EXISTING dependency_overrides
            sed -i 's/jni: 1\.0\.0/jni: ^1.1.0/g' pubspec.yaml
            sed -i 's/jni: "1\.0\.0"/jni: ^1.1.0/g' pubspec.yaml
            # Step 4: Fix version in pubspec.yaml (flet may not write it correctly)
            sed -i 's/^version: .*/version: 4.0.0+20261003/' pubspec.yaml
            # Step 5: Find SERIOUS_PYTHON_SITE_PACKAGES dir (flet packages Python deps here)
            echo "=== Searching for site-packages ==="
            SP_DIR=$(find . -type d -name "site-packages" 2>/dev/null | head -1)
            if [ -z "$SP_DIR" ]; then
              # Try flet's python app dir
              SP_DIR=$(find . -type d -path "*flet*python*" 2>/dev/null | head -1)
            fi
            if [ -z "$SP_DIR" ]; then
              # Try .dart_tool
              SP_DIR=$(find .dart_tool -type d -name "site-packages" 2>/dev/null | head -1)
            fi
            echo "site-packages dir: $SP_DIR"
            if [ -n "$SP_DIR" ]; then
              export SERIOUS_PYTHON_SITE_PACKAGES="$(pwd)/$SP_DIR"
              echo "Set SERIOUS_PYTHON_SITE_PACKAGES=$SERIOUS_PYTHON_SITE_PACKAGES"
              ls -la "$SERIOUS_PYTHON_SITE_PACKAGES" | head -5
            else
              echo "WARNING: site-packages not found, listing .dart_tool:"
              find .dart_tool -maxdepth 3 -type d 2>/dev/null | head -20
              echo "Listing android assets:"
              find android -name "*.zip" -o -name "site-packages" 2>/dev/null | head -10
            fi
            # Step 6: Build APK manually
            flutter pub get
            flutter build apk --release --build-number 20261003 --build-name 4.0.0
            # Step 7: Find and copy APK to workspace root
            echo "=== Searching for APK ==="
            APK_PATH=$(find . -name "app-release.apk" -type f 2>/dev/null | head -1)
            echo "APK found at: $APK_PATH"
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" "$GITHUB_WORKSPACE/app-release.apk"
              ls -la "$GITHUB_WORKSPACE/app-release.apk"
            else
              echo "ERROR: APK not found!"
              find . -name "*.apk" -type f 2>/dev/null
              exit 1
            fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-apk
          path: app-release.apk
