[project]
name = "lantalk"
version = "2.8.5"
description = "LanTalk mobile client"
# Flet 0.86 起，音频控件 ft.Audio 对应的 Flutter 插件 flet_audio
# 必须在 dependencies 中声明，构建 APK 时才会被打包（旧的 --include-packages 参数已移除）
dependencies = [
    "flet==0.86.5",
    "flet-audio>=0.86.0",
    "pyjnius>=1.6.1",
]

[tool.flet.organization]
org = "com.lantalk"

[tool.flet.android]
# Android 权限声明：语音通话需要录音，网络通信需要 INTERNET
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
    "android.permission.ACCESS_WIFI_STATE",
    "android.permission.RECORD_AUDIO",
    "android.permission.MODIFY_AUDIO_SETTINGS",
    "android.permission.BLUETOOTH",
    "android.permission.BLUETOOTH_CONNECT",
    "android.permission.FOREGROUND_SERVICE",
    "android.permission.WAKE_LOCK",
]
