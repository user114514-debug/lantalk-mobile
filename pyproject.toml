[project]
name = "lantalk"
version = "4.0.0"
description = "LanTalk mobile client"
# Flet 0.86 起，音频控件 ft.Audio 对应的 Flutter 插件 flet_audio
# 必须在 dependencies 中声明，构建 APK 时才会被打包（旧的 --include-packages 参数已移除）
# 注意：flet build apk 以本列表为准决定哪些 Python 包进 APK，
# 缺 cryptography 会导致启动时 crypto 模块 import 失败直接崩溃。
dependencies = [
    "flet==0.86.5",
    "flet-audio>=0.86.0",
    "flet-android-notifications>=0.11.0",
    "cryptography>=42.0.0",
    "pyjnius>=1.6.1",
    "psutil>=7.0.0",
]

[tool.flet.organization]
org = "com.lantalk"

# 应用图标：指定图标文件路径 + 背景色（图标本身已有不透明背景）
[tool.flet]
icon = "assets/icon.png"
icon_background = "#34C759"

# 打包彩色 emoji 字体（Twemoji，COLRv0）：含全部国旗、新 emoji 与 ZWJ 组合表情。
# 设备自带 emoji 字体缺字形（尤其国旗）时，通过主题 fontFamilyFallback 回退到本字体。
[[tool.flet.fonts]]
font_family = "Twemoji"
font_file = "assets/fonts/Twemoji.ttf"

[tool.flet.android]
# Android自适应图标背景色（与assets/icon.png主色调匹配）
adaptive_icon_background = "#34C759"

# Android 权限声明：Flet 0.86 起必须用 [tool.flet.android.permission] 子表
# （键="权限名"，值=true）；旧的 permissions=[...] 数组写法不会被注入 Manifest，
# 会导致麦克风/照片权限缺失，表现为语音闪退、文件选择器不弹窗。
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.ACCESS_WIFI_STATE" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true
"android.permission.BLUETOOTH" = true
"android.permission.BLUETOOTH_CONNECT" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.WAKE_LOCK" = true
# 照片/视频/音频/文件（FilePicker 与媒体访问，API 33+ 用 READ_MEDIA_*）
"android.permission.READ_MEDIA_IMAGES" = true
"android.permission.READ_MEDIA_VIDEO" = true
"android.permission.READ_MEDIA_AUDIO" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
